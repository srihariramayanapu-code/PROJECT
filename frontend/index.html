<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="toastContainer"></div>

    <div class="container">

        <h1>Student Management System</h1>
        
        <p class="subtitle">Manage student records</p>
        <!-- Student Statistics -->
<div class="stats-container">

    <div class="stat-card">
        <div class="stat-icon">👨‍🎓</div>
        <div>
            <h3>Total Students</h3>
            <p id="totalStudents">0</p>
        </div>
    </div>

    <div class="stat-card">
        <div class="stat-icon">📚</div>
        <div>
            <h3>Total Courses</h3>
            <p id="totalCourses">0</p>
        </div>
    </div>

    <div class="stat-card">
        <div class="stat-icon">🎂</div>
        <div>
            <h3>Average Age</h3>
            <p id="averageAge">0</p>
        </div>
    </div>

</div>

        <!-- Student Form -->
        <div class="card">

            <div class="form-title-row">
                <h2 id="formTitle">Add Student</h2>
                <span id="editModeBadge">EDIT MODE</span>
            </div>

            <form id="studentForm">

                <div class="form-group">
                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter student name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="course">Course</label>
                    <input
                        type="text"
                        id="course"
                        placeholder="Enter course"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="age">Age</label>
                    <input
                        type="number"
                        id="age"
                        placeholder="Enter age"
                        min="1"
                        max="100"
                        required
                        >
                </div>

                <div class="form-buttons">
        

    <button type="submit" class="add-btn">
        Add Student
    </button>

    

    <button
        type="button"
        id="cancelEditBtn"
        class="cancel-btn"
        onclick="cancelEdit()"
        style="display: none;">
        Cancel
    </button>
    

</div>


            </form>

        </div>
        <div class="card course-summary-card">

    <h2>Course Distribution</h2>

<div id="courseDistribution">
    No course data available
</div>

<div class="chart-container">
    <h3>Student Distribution Chart</h3>
    <canvas id="courseChart"></canvas>
</div>

</div>

        <!-- Student Table -->
        <div class="card">

    <div class="table-header">
    <div>
        <h2>Student Records</h2>
        <span id="studentCountText">Showing 0 students</span>
    </div>

<div class="table-actions">

    <select id="courseFilter" onchange="filterAndSearchStudents()">
        <option value="">All Courses</option>
    </select>

    <select id="sortOption" onchange="filterAndSearchStudents()">
        <option value="">Sort By</option>
        <option value="id-asc">ID: Low to High</option>
        <option value="id-desc">ID: High to Low</option>
        <option value="name-asc">Name: A to Z</option>
        <option value="name-desc">Name: Z to A</option>
        <option value="age-asc">Age: Low to High</option>
        <option value="age-desc">Age: High to Low</option>
        <option value="course-asc">Course: A to Z</option>
        <option value="course-desc">Course: Z to A</option>
    </select>

    <input
        type="text"
        id="searchInput"
        placeholder="Search students..."
        oninput="filterAndSearchStudents()"
    >

    <button onclick="refreshStudents()" class="refresh-btn">
        Refresh
    </button>        


    <button onclick="clearFilters()" class="clear-filter-btn">
        Clear Filters
    </button>

    <button onclick="exportStudents()" class="export-btn">
        Export CSV
    </button>
    <input
    type="file"
    id="csvFileInput"
    accept=".csv"
    style="display: none;"
    onchange="importStudentsFromCSV(event)"
>

<button
    type="button"
    class="import-btn"
    onclick="document.getElementById('csvFileInput').click()"
>
    Import CSV
</button>

<button
    type="button"
    class="pdf-btn"
    onclick="generateStudentReport()"
>
    Generate PDF
</button>

</div>

</div>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Course</th>
                            <th>Age</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="studentTableBody">

                        <tr>
                            <td colspan="6" class="empty">
                                No students found
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

            <div id="paginationContainer" class="pagination-container"></div>

        </div>
        <div class="logout-section">
                <button onclick="logout()" class="logout-btn">
                    Logout
                </button>
            </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="script.js"></script>

            

</body>


</html>
